[package]
name = "textdistance-port"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust port of the TextDistance algorithms"
# Native algorithm tests live directly under the package-root tests/ directory.
# Cargo discovers each tests/algorithm_<name>.rs file automatically.

[dependencies]
bzip2 = { version = "0.4", features = ["static"] }
flate2 = "1"
pyo3 = { version = "0.29", optional = true }
xz2 = { version = "0.1", features = ["static"] }

[build-dependencies]
pyo3-build-config = "0.29"

[lib]
name = "textdistance_port"
path = "rust/src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3"]
python-extension = ["python", "pyo3/extension-module"]

[[test]]
name = "core_contract"
path = "rust/tests/common.rs"

[[test]]
name = "registry"
path = "rust/tests/registry.rs"
