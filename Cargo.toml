[package]
name = "textdistance-port"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust port of the TextDistance algorithms"
# Native algorithm tests live directly under the package-root tests/ directory.
# Cargo discovers each tests/algorithm_<name>.rs file automatically.

[lib]
name = "textdistance_port"
path = "rust/src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = []

[[test]]
name = "core_contract"
path = "rust/tests/common.rs"

[[test]]
name = "registry"
path = "rust/tests/registry.rs"
