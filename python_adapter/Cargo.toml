[package]
name = "textdistance-adapter"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Thin PyO3 boundary that exposes the Rust TextDistance core to Python (SIM-10)"

[lib]
name = "textdistance_rust"
crate-type = ["cdylib"]

[dependencies]
textdistance-port = { path = ".." }
pyo3 = { version = "0.22", features = ["extension-module"] }
